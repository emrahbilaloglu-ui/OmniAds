# Creative v2 hardening workflow: read-only safety gate; behavior unchanged.
# Public Raw verification marker: multiline LF formatting required.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The zero-base route and interaction graph pushes TypeScript past Node's
    # default ~2 GB heap on a clean Linux checkout. Keep the exact same full
    # typecheck, but give it bounded headroom below the build job's 6 GB cap.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc --noEmit

      - name: Verify release authority preflight
        # The preflight refuses to pass while ZERO_BASE_UI_MODE is unset, on
        # purpose: unset parses as `off`, and `off` routes every canonical
        # surface back to its legacy owner, so shipping it by omission is the
        # failure that gate exists to stop.
        #
        # CI is not a deployment target and this value reaches no server. The
        # production mode lives in the host env file and is written only by
        # `zero-base-production-rollout.yml`. `off` is declared here because it
        # is what an unset variable already parses to, so this makes the
        # declaration explicit without changing what CI verifies. It is scoped
        # to this step so it cannot leak into any other job step.
        env:
          ZERO_BASE_UI_MODE: "off"
        run: npm run release:authority:preflight

  test-shard:
    name: test-shard-${{ matrix.shard }}-of-${{ matrix.total }}
    runs-on: ubuntu-latest
    # PR #272 proved that one clean Linux runner cannot complete the growing
    # suite inside a useful bounded release gate. Split files deterministically
    # across four runners: every test still runs exactly once and assertions
    # remain unchanged. Four is deliberately bounded and keeps the slowest
    # shard comfortably inside the finite job timeout.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # D077 proves the cumulative release inventory against its pinned
          # pre-release base SHA. A depth-1 PR checkout cannot resolve that
          # commit and would fail before evaluating the manifest contract.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: |
          npm run test -- --shard=${{ matrix.shard }}/${{ matrix.total }} --exclude=scripts/audits/d080-meta-budget-edit-evidence.test.ts

      - name: Creative v2 safety gate
        if: matrix.shard == 1
        run: |
          npm run creative:v2:safety

  d080_evidence:
    name: d080-evidence-${{ matrix.group }}
    runs-on: ubuntu-latest
    # The frozen-evidence verifier deliberately re-hashes a large package for
    # 372 adversarial tests. On the clean PR runner the file itself took 31m43s;
    # leaving it in a file-sharded worker concentrated that cost in one shard
    # and caused the 45-minute job bound to cancel unrelated tests. Four named
    # suite ranges split the measured verification load without splitting test
    # bodies. A collection check proves their union is all 372 tests with no
    # overlap; every assertion still runs exactly once.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: c3-c4
            pattern: '^(?:C3\.|C4\.|ownership, schema contract and units|the frozen artifact verifies itself)'
          - group: c5
            pattern: '^C5(?:\.| baseline)'
          - group: c6
            pattern: '^C6\.'
          - group: c7-c10
            pattern: '^(?:C7\.|C8\.|C9\.|C10\b)'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: D080 frozen-evidence contract
        run: |
          npm run test -- scripts/audits/d080-meta-budget-edit-evidence.test.ts --no-file-parallelism --maxWorkers=1 -t '${{ matrix.pattern }}'

  # Preserve one stable required check and one release dependency. This job is
  # green only when every matrix shard (including the safety gate on shard 1)
  # and the isolated D080 contract are green; `always()` ensures a failed or
  # cancelled prerequisite cannot turn into a silently skipped release gate.
  test:
    if: always()
    needs:
      - test-shard
      - d080_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test shard
        env:
          TEST_SHARD_RESULT: ${{ needs.test-shard.result }}
          D080_EVIDENCE_RESULT: ${{ needs.d080_evidence.result }}
        run: |
          if [[ "${TEST_SHARD_RESULT}" != "success" ]]; then
            echo "One or more test shards did not succeed: ${TEST_SHARD_RESULT}"
            exit 1
          fi
          if [[ "${D080_EVIDENCE_RESULT}" != "success" ]]; then
            echo "D080 evidence contract did not succeed: ${D080_EVIDENCE_RESULT}"
            exit 1
          fi

  database-seams:
    runs-on: ubuntu-latest
    # Raised with the DR restore, grant-race and context-access seams: each
    # starts its own PostgreSQL and the DR one migrates two databases.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 — the schema upgrade seam reads the pre-change
          # commit's migrations to validate that its rewind describes a schema
          # production actually had.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          echo "EPHEMERAL_PG_BIN_DIR=$(pg_config --bindir)" >> "$GITHUB_ENV"

      # ONE canonical sequence, shared with `npm run verify:pre-push`.
      #
      # This job used to spell every seam out inline. The local habit was to run
      # "the relevant ones", the two lists drifted, and the drift only showed up
      # as a failed push: a guard that passed locally was never re-run on the
      # final tree, and CI ran a different set in a different order. Both sides
      # now execute scripts/verify-database-seams.sh, so there is nothing left
      # to keep in sync. The script echoes each stage, so the log still reads
      # step by step.
      - name: Database seams (canonical sequence)
        run: bash scripts/verify-database-seams.sh
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # `next build` holds the webpack graph and runs TypeScript in the same
        # process, and together they exceed the runner's default ~2GB heap:
        # the compile succeeds and the type-check phase then dies with
        # "Ineffective mark-compacts near heap limit". The standalone typecheck
        # uses its own 4GB cap; webpack still needs the Dockerfile-matched 6GB.
        #
        # Matched to the Dockerfile's allocation on purpose. A gate that passes
        # with more headroom than the image it is meant to vouch for is not a
        # gate -- CI would go green while the deploy build OOMs.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm run build

  detect-runtime-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.filter.outputs.runtime_changed }}
      schema_changed: ${{ steps.filter.outputs.schema_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect runtime-affecting changes
        id: filter
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          runtime_changed="false"
          schema_changed="false"
          live_build_sha=""
          schema_regex_parts=(
            '^(lib/migrations(\..*)?\.ts'
            '|scripts/run-migrations\.ts'
            '|lib/db-schema-readiness\.ts'
            '|app/api/migrate/route\.ts)$'
          )
          schema_regex="$(printf '%s' "${schema_regex_parts[@]}")"
          # Defined HERE, not inside the before/current branch below, because the
          # live-build comparison further down needs it too and `set -u` would
          # abort on a variable that only exists in a branch that did not run.
          runtime_regex_parts=(
            '^(\.github/workflows/|app/|components/|hooks/|lib/'
            '|providers/|public/|scripts/|src/|store/'
            # deploy/ ships INSIDE the worker image: the cutover wrapper reads
            # deploy/db/recovery-policy.tsv from /app/deploy, and the daily
            # backup script is installed from there. A change to either is a
            # runtime change, and treating it as one is what makes the host
            # actually receive it — without this, the repository says the
            # policy changed and production keeps running the old one.
            '|deploy/'
            '|docs/v3-01-release-authority\.md$'
            '|Dockerfile$|docker-compose\.yml$|package\.json$|package-lock\.json$'
            '|next\.config\.ts$|next-env\.d\.ts$|postcss\.config\.mjs$'
            '|instrumentation\.ts$|instrumentation\.node\.ts$'
            '|tsconfig\.json$|proxy\.ts$|proxy\.test\.ts$'
            '|middleware\.ts$|middleware\.test\.ts$)'
          )
          runtime_regex="$(printf '%s' "${runtime_regex_parts[@]}")"

          resolve_live_build_sha() {
            local payload
            if ! payload="$(curl -fsSL https://adsecute.com/api/build-info 2>/dev/null)"; then
              return 1
            fi

            python3 - "${payload}" 2>/dev/null <<'PY' || return 1
          import json
          import re
          import sys

          payload = json.loads(sys.argv[1])
          build_id = str(payload.get("buildId") or "").strip()
          if re.fullmatch(r"[0-9a-fA-F]{40}", build_id):
              print(build_id, end="")
              raise SystemExit(0)
          raise SystemExit(1)
          PY
          }

          if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            runtime_changed="true"
            schema_changed="true"
            echo "No valid before SHA."
            echo "Defaulting to runtime_changed=true schema_changed=true."
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            runtime_changed="true"
            schema_changed="true"
            echo "Before SHA ${BEFORE_SHA} is not available locally."
            echo "Defaulting to runtime_changed=true schema_changed=true."
          else
            changed_files="$(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")"
            printf 'Changed files:\n%s\n' "${changed_files}"

            # Do not pipe a large file list into `grep -q` under pipefail.
            # Once grep finds its first match it closes the pipe; printf then
            # gets EPIPE and the successful match is reported as a failed
            # pipeline. The zero-base merge was large enough to expose that
            # false negative and incorrectly skipped both image publishes.
            if grep -Eq "${runtime_regex}" <<< "${changed_files}"; then
              runtime_changed="true"
              echo "Runtime-affecting change detected."
            fi

            if grep -Eq "${schema_regex}" <<< "${changed_files}"; then
              schema_changed="true"
              echo "Schema-affecting change detected."
            fi
          fi

          if live_build_sha="$(resolve_live_build_sha)"; then
            echo "Live build SHA resolved from public build-info: ${live_build_sha}"
            if git cat-file -e "${live_build_sha}^{commit}" 2>/dev/null; then
              live_changed_files="$(git diff --name-only "${live_build_sha}" "${CURRENT_SHA}")"
              if grep -Eq "${schema_regex}" <<< "${live_changed_files}"; then
                schema_changed="true"
                echo "Schema-affecting change detected between:"
                echo "live build ${live_build_sha}"
                echo "current build ${CURRENT_SHA}"
              fi
              # And the same question for runtime, which used to be asked only
              # of the LAST PUSH. That made deployability depend on what the
              # final commit happened to touch: a commit changing only, say,
              # .github/scripts/ published no image, so `main` itself became
              # un-deployable while still differing from production in app code.
              # The condition that actually matters is this one — production
              # differs from main in a runtime path, so an image for main must
              # exist.
              if grep -Eq "${runtime_regex}" <<< "${live_changed_files}"; then
                runtime_changed="true"
                echo "Runtime-affecting change detected between:"
                echo "live build ${live_build_sha}"
                echo "current build ${CURRENT_SHA}"
              fi
            else
              echo "Live build SHA ${live_build_sha} is not available locally."
              echo "Preserving current schema_changed=${schema_changed}."
            fi
          else
            echo "Unable to resolve live build SHA from public build-info."
            echo "Preserving current schema_changed=${schema_changed}."
          fi

          echo "runtime_changed=${runtime_changed}" >> "$GITHUB_OUTPUT"
          echo "schema_changed=${schema_changed}" >> "$GITHUB_OUTPUT"



  publish-web-image:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-runtime-changes.outputs.runtime_changed == 'true'
    needs:
      - typecheck
      - test
      # The real-database seams are the only proof the migration, admission,
      # authority and DR paths behave against PostgreSQL rather than a mock.
      # Publishing an image without them means a green pipeline can ship a
      # release whose schema and cutover proofs never ran.
      - database-seams
      - detect-runtime-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # The GHCR namespace has to be THIS repository's owner, not a name we like.
    #
    # secrets.GITHUB_TOKEN is minted for this repository, and `packages: write`
    # grants it push access only to packages owned by the namespace this
    # repository belongs to. After the transfer that owner is emrahbilaloglu-ui,
    # so ghcr.io/erhanrdn is simply not writable from here any more: leaving the
    # old value would fail the push with a 403 denied. It would not quietly
    # publish to the wrong place, but it would break every release.
    #
    # The first push to the new path CREATES the package under emrahbilaloglu-ui
    # and GitHub links this repository to it automatically, so nothing has to be
    # provisioned by hand before the first green main build. Note the reverse is
    # also true and is why the old namespace survives elsewhere: transferring a
    # repository does NOT carry its GHCR packages across, so every pre-transfer
    # image still exists only under ghcr.io/erhanrdn. That namespace is
    # preserved in the rollback path (deploy-hetzner.yml), not here.
    #
    # Written as a literal rather than ghcr.io/${{ github.repository_owner }}:
    # the cross-language contract test compares this exact string against
    # RELEASE_AUTHORITY_WEB_IMAGE in lib/release-authority/types.ts, and an
    # expression cannot be compared statically.
    env:
      WEB_IMAGE: ghcr.io/emrahbilaloglu-ui/omniads-web
      BUILD_CACHE_SCOPE: app-image-build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web-runner
          push: true
          provenance: false
          build-args: |
            APP_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.BUILD_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILD_CACHE_SCOPE }}

  publish-worker-image:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-runtime-changes.outputs.runtime_changed == 'true'
    needs:
      - typecheck
      - test
      # The real-database seams are the only proof the migration, admission,
      # authority and DR paths behave against PostgreSQL rather than a mock.
      # Publishing an image without them means a green pipeline can ship a
      # release whose schema and cutover proofs never ran.
      - database-seams
      - detect-runtime-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Same namespace-and-token reasoning as publish-web-image above. Kept as a
    # per-job literal, rather than composed from one shared workflow-level
    # namespace, because the `env` context is not among the contexts available
    # inside `jobs.<job_id>.env` — referencing it there is a workflow
    # validation error, not a value. Each job still names its image exactly
    # once and every use below goes through ${{ env.WORKER_IMAGE }}.
    env:
      WORKER_IMAGE: ghcr.io/emrahbilaloglu-ui/omniads-worker
      BUILD_CACHE_SCOPE: app-image-build-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker-runner
          push: true
          provenance: false
          build-args: |
            APP_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.BUILD_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILD_CACHE_SCOPE }}

  # THE PRODUCTION RELEASE BOUNDARY.
  #
  # A `dispatch-deploy` job used to live here. It fired automatically on every
  # push to main whose changes touched runtime code, calling the deploy
  # workflow's dispatch API as soon as both images published. Merging was
  # therefore the same act as deploying, and nobody chose the second one.
  #
  # That is removed, deliberately and permanently. CI on main proves the code
  # and publishes the exact-SHA web and worker images; it does not put them on a
  # server. Production deployment is a separate, explicit `workflow_dispatch` of
  # deploy-hetzner.yml carrying a verified 40-hex lowercase SHA and an
  # enumerated image namespace (current | legacy).
  #
  # This is a boundary, not a pause: it is not a commit-message marker, a
  # temporary skip, or a repository variable, because every one of those can be
  # flipped silently by someone who does not know why it was set. Restoring an
  # automatic dispatch means deleting this comment and defeating
  # scripts/check-release-owner-references.sh's sibling guard in
  # scripts/deploy-gate-ordering-check.sh, which asserts no workflow in this
  # repository dispatches a deploy without a human.


  skip-runtime-deploy:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-runtime-changes.outputs.runtime_changed != 'true'
    needs:
      - typecheck
      - test
      # The real-database seams are the only proof the migration, admission,
      # authority and DR paths behave against PostgreSQL rather than a mock.
      # Publishing an image without them means a green pipeline can ship a
      # release whose schema and cutover proofs never ran.
      - database-seams
      - detect-runtime-changes
    runs-on: ubuntu-latest
    steps:
      - name: Explain deploy skip
        shell: bash
        run: |
          echo "No runtime-affecting files changed."
          echo "Image publish and deploy were intentionally skipped."
