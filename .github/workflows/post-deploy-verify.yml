name: Post-Deploy Verification

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact deployed commit SHA to observe post-deploy
        required: true
        type: string

concurrency:
  group: post-deploy-verify-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve expected SHA
        id: expected
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          expected_sha="${INPUT_SHA}"

          if [ -z "${expected_sha}" ]; then
            echo "Expected SHA is required."
            exit 1
          fi

          case "${expected_sha}" in
            *[!0-9a-fA-F]*)
              echo "Expected SHA must be hexadecimal."
              exit 1
              ;;
          esac

          if [ "${#expected_sha}" -ne 40 ]; then
            echo "Expected SHA must be the full 40-character commit SHA."
            exit 1
          fi

          echo "sha=${expected_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout expected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.expected.outputs.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify exact public build
        id: exact_build
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
        run: |
          set -euo pipefail

          mkdir -p .artifacts
          curl -fsS --max-time 10 --retry 4 --retry-all-errors --retry-max-time 60 \
            "https://adsecute.com/api/build-info?post_deploy_build=${EXPECTED_SHA}" \
            -o .artifacts/post-deploy-build-info.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(".artifacts/post-deploy-build-info.json").read_text(encoding="utf-8"))
          actual = payload.get("buildId") if isinstance(payload, dict) else None
          expected = os.environ["EXPECTED_SHA"]
          if actual != expected:
              raise SystemExit(f"Public build mismatch: expected {expected}, observed {actual!r}")
          print(f"Public build verified: {actual}")
          PY

      - name: Verify public and workspace documents
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
        run: |
          set -euo pipefail

          mkdir -p .artifacts
          login_status="$(curl -sS --max-time 10 --retry 4 --retry-all-errors --retry-max-time 60 \
            -w '%{http_code}' \
            "https://adsecute.com/login?post_deploy_style=${EXPECTED_SHA}" \
            -o .artifacts/public-login.html)"

          if [ "${login_status}" != "200" ]; then
            echo "Public login did not render successfully (HTTP ${login_status})."
            exit 1
          fi

          if ! grep -q '<link rel="stylesheet"' .artifacts/public-login.html; then
            echo "Public login has no stylesheet entry."
            exit 1
          fi

          mapfile -t stylesheet_paths < <(
            grep -o '/_next/static/css/[^"[:space:]]*\.css' .artifacts/public-login.html | sort -u
          )
          if [ "${#stylesheet_paths[@]}" -eq 0 ]; then
            echo "Could not resolve the emitted workspace stylesheet."
            exit 1
          fi

          : > .artifacts/public-login.css
          for stylesheet_path in "${stylesheet_paths[@]}"; do
            curl -fsS --max-time 10 --retry 4 --retry-all-errors --retry-max-time 60 \
              "https://adsecute.com${stylesheet_path}" \
              >> .artifacts/public-login.css
          done
          if ! grep -q -- '--font-adc-sans' .artifacts/public-login.css; then
            echo "The emitted login stylesheet does not contain the canonical design contract."
            exit 1
          fi

          # Asked WITHOUT the cache-buster the style checks above use.
          #
          # This probe reads a 307, not a document, so it has nothing to bust --
          # and the buster is what broke it. The login bounce preserves the
          # original query on purpose, because an OAuth `?code=` or a saved
          # `?range=` has to survive the round trip, so appending
          # `?post_deploy_style=<sha>` made the location
          # `/login?next=%2Fapp%2Fhome%3Fpost_deploy_style%3D<sha>` and the exact
          # match below failed against the gate's own parameter rather than
          # against anything the deploy did.
          workspace_status="$(curl -sS --max-time 10 --retry 4 --retry-all-errors --retry-max-time 60 \
            -D .artifacts/workspace-redirect.headers \
            -w '%{http_code}' \
            "https://adsecute.com/app/home" \
            -o .artifacts/workspace-redirect.html)"

          if [ "${workspace_status}" != "307" ]; then
            echo "Anonymous workspace request did not return the expected auth redirect (HTTP ${workspace_status})."
            exit 1
          fi

          if ! tr -d '\r' < .artifacts/workspace-redirect.headers \
            | grep -Eq '^location: /login\?next=%2Fapp%2Fhome$'; then
            echo "Anonymous workspace redirect does not point to the clean login URL."
            exit 1
          fi

      # The live runtime cannot resolve the private repo's main SHA anonymously,
      # so the checker resolves refs/heads/main itself (git ls-remote via the
      # persisted checkout credentials, with GITHUB_SHA as fallback) and
      # re-derives the live-vs-main verdict before judging the deploy.
      - name: Verify public release authority (report-only)
        id: release_authority
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .artifacts

          node --import tsx scripts/verify-release-authority.ts \
            --mode=post_deploy \
            --base-url=https://adsecute.com \
            --expected-build-id=${{ steps.expected.outputs.sha }} \
            | tee .artifacts/post-deploy-release-authority.json >/dev/null

      - name: Write verification summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_lines = [
              "## Post-Deploy Verification",
              "",
              f"- expectedBuildId: `{os.environ['EXPECTED_SHA']}`",
              f"- exactBuildStep: `{os.environ['EXACT_BUILD_OUTCOME']}`",
              f"- releaseAuthorityStep: `{os.environ['RELEASE_AUTHORITY_OUTCOME']}`",
          ]

          release_path = Path(".artifacts/post-deploy-release-authority.json")
          if release_path.exists():
              payload = json.loads(release_path.read_text(encoding="utf-8"))
              report = payload.get("summary") or {}
              summary_lines.extend(
                  [
                      "",
                      "### Release Authority",
                      f"- result: `{report.get('result')}`",
                      f"- blockerCount: `{len(report.get('blockers') or [])}`",
                  ]
              )
              blockers = report.get("blockers") or []
              if blockers:
                  summary_lines.append("- blockers: `" + " | ".join(str(blocker) for blocker in blockers) + "`")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary_lines) + "\n")
          PY
        env:
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
          EXACT_BUILD_OUTCOME: ${{ steps.exact_build.outcome }}
          RELEASE_AUTHORITY_OUTCOME: ${{ steps.release_authority.outcome }}

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-verify-${{ steps.expected.outputs.sha }}
          path: |
            .artifacts/post-deploy-build-info.json
            .artifacts/post-deploy-release-authority.json
            .artifacts/public-login.html
            .artifacts/public-login.css
            .artifacts/workspace-redirect.headers
            .artifacts/workspace-redirect.html
          if-no-files-found: error
          include-hidden-files: true
