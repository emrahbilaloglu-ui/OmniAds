# Creative v2 hardening workflow: read-only safety gate; behavior unchanged.
# Public Raw verification marker: multiline LF formatting required.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc --noEmit

      - name: Verify release authority preflight
        run: >-
          node --import tsx scripts/verify-release-authority.ts --mode=preflight

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: |
          npm run test

      - name: Creative v2 safety gate
        run: |
          npm run creative:v2:safety

  database-seams:
    runs-on: ubuntu-latest
    # Raised with the DR restore, grant-race and context-access seams: each
    # starts its own PostgreSQL and the DR one migrates two databases.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 — the schema upgrade seam reads the pre-change
          # commit's migrations to validate that its rewind describes a schema
          # production actually had.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          echo "EPHEMERAL_PG_BIN_DIR=$(pg_config --bindir)" >> "$GITHUB_ENV"

      - name: Migrations from zero
        run: npm run test:migrations-from-zero

      # Disaster recovery, end to end and for real: the ACTUAL daily backup
      # script runs against a migrated database, the artifact is restored into
      # an empty one, and the restored copy must match on every row count, have
      # every foreign key re-validated by PostgreSQL itself, carry byte-identical
      # authority (generations, selections, claims, fingerprints, scheduling
      # receipts), and be something migrations and the schema contract accept.
      # The old daily backup covered 15 of 202 tables and none of that authority.
      - name: Disaster-recovery backup and restore seam
        run: npm run test:dr-restore-seam

      - name: Native ad decision database seam
        run: node --import tsx scripts/ephemeral-postgres-native-ad-decision-seam.ts

      # The three seams that carry this change's real-PostgreSQL proofs. They
      # are the only place the two-layer model, receipt-first retention, the
      # growth-fence budgets and the pre-change upgrade path are exercised
      # against a real server, so a green unit suite without them is not
      # evidence the change is safe to deploy.
      - name: Provider fixture seam
        run: npm run test:provider-fixture-seam

      - name: Sync retention, growth and release seam
        run: npm run test:sync-retention-seam

      # sync_release_gates reached ~1.35 GB because every evaluation appended a
      # row and every read scanned the build's whole history. Neither is visible
      # on three rows, so this seam seeds 500k and pins work_mem/temp_file_limit
      # low enough that an unindexed sort is an ERROR rather than a slow query.
      - name: Release-gate plan and coalescing seam
        run: npm run test:release-gate-plan-seam

      # Migrations rerun on every deploy. The legacy import steps used
      # ON CONFLICT DO UPDATE, so a rerun replayed stale legacy rows over
      # canonical truth — undoing a disconnect, a rotation, a refresh or a
      # deselection. This seam contradicts the legacy rows and reruns the chain.
      - name: Legacy import replay seam
        run: npm run test:legacy-replay-seam

      # The wrapper now lives in scripts/, which an existing Dockerfile COPY
      # already ships into the worker image — so there is one canonical copy
      # rather than a generated duplicate. This refuses a commit that edits the
      # cutover script without repackaging its manifest, which would otherwise
      # deploy a wrapper whose digest no longer matches the one the host checks.
      - name: Cutover wrapper package is current
        run: |
          set -euo pipefail
          bash -n scripts/hetzner-sync-cutover.sh
          bash -n scripts/cutover-wrapper-package.sh
          bash -n scripts/cutover-real-postgres-harness.sh
          bash -n scripts/cutover-wrapper-build-context-check.sh
          npm run test:cutover-wrapper-package

      # A STATIC assertion that the wrapper is inside the Docker build context
      # and captured by an existing COPY. It is NOT a container smoke test: no
      # image is built, no layer is read, nothing is executed in the image. It
      # exists so a .dockerignore or Dockerfile edit that would silently stop
      # shipping the wrapper fails here instead of at a cutover.
      - name: Cutover wrapper build-context assertion (static, not a smoke test)
        run: npm run test:cutover-build-context

      # bash -n proves the cutover script parses. It says nothing about whether
      # the phase graph can be traversed, whether the two-host split holds, or
      # whether a failed phase resumes — and a harness with canned SQL answers
      # cannot say whether the fingerprint queries are even valid SQL. This runs
      # every phase, plus the negative controls, against a REAL ephemeral
      # PostgreSQL and a split app-host/DB-host command surface.
      - name: Cutover state-machine harness (real PostgreSQL)
        run: npm run test:cutover-harness

      # Admission over the REAL exported entrypoints, not a source scan. Both
      # failures it replaces looked fine from outside: the cron performed a
      # complete pass and reported the refusal at the end, and dead-letter
      # replay had no admission at all.
      - name: Entrypoint admission refusal seam
        run: npx vitest run lib/sync/entrypoint-admission.test.ts

      # The unit table proves the guard is reached; it cannot prove a refused
      # entrypoint left the database untouched, because a mocked client has no
      # rows to leave. This calls the REAL exports against a migrated PostgreSQL
      # and requires a byte-identical census and zero provider calls.
      - name: Entrypoint admission real-database seam
        run: npm run test:entrypoint-admission-seam

      # Selection is a read-decide-write across a provider round trip. A unit
      # test cannot show that a reconnect committing mid-flight actually BLOCKS
      # on the row lock, or that a failure part-way through leaves no identity
      # behind; this races two real backends against the app pool.
      - name: Provider selection race seam
        run: npm run test:selection-race-seam

      # One Shopify grant, many finalizers. Proves exactly one winner across
      # separate backends, that a refused finalize performs zero provider work,
      # that a retryable failure restores the grant with its ORIGINAL expiry
      # rather than extending or reviving it, and that the shop's access token is
      # encrypted at rest with no plaintext surviving the conversion.
      - name: Shopify install context seam
        run: npm run test:shopify-install-seam

      # The guard runs before EVERY Shopify request, not once per sequence. A
      # committed reconnect from a separate backend between call 1 and call 2
      # must stop the remaining calls and must not produce a success receipt.
      - name: Shopify grant race seam
        run: npm run test:shopify-grant-race-seam

      # A pending Shopify install context is a live shop grant. Proves the read
      # is exclusive under concurrency, that twelve distinct bearer/foreign/
      # expired/cross-business shapes are refused with byte-identical state, and
      # that the legitimate Shopify-initiated install still binds and finalizes.
      - name: Shopify install-context read authority seam
        run: npm run test:shopify-context-access-seam

      # Fail-closed proof for the ORDINARY deploy path: a release carrying
      # deploy/CUTOVER_REQUIRED must not be migratable outside the cutover lock.
      - name: Ordinary deploy refuses a cutover-required release
        run: |
          set -euo pipefail
          bash -n .github/scripts/hetzner-remote.sh
          test -f deploy/CUTOVER_REQUIRED || {
            echo "deploy/CUTOVER_REQUIRED is absent; this release claims it does not need the cutover" >&2
            exit 1
          }
          grep -q 'deploy/CUTOVER_REQUIRED' .github/scripts/hetzner-remote.sh

          # The runbook must name the path that exists ON THE HOST. `.github/`
          # is excluded from the image, so the repository path it used to print
          # is a path the operator cannot run — and a runbook that cannot be
          # followed is the failure mode the cutover has least room for.
          installed=/var/www/adsecute/cutover/hetzner-sync-cutover.sh
          grep -q "${installed}" docs/global-sync-rollout-runbook.md || {
            echo "the runbook does not name the installed wrapper path ${installed}" >&2
            exit 1
          }
          grep -q "${installed}" deploy/CUTOVER_REQUIRED || {
            echo "deploy/CUTOVER_REQUIRED does not name ${installed}" >&2
            exit 1
          }
          ! grep -qE '^\s*(\./)?(\.github/)?scripts/hetzner-sync-cutover\.sh' docs/global-sync-rollout-runbook.md || {
            echo "the runbook still instructs running the repository copy of the wrapper" >&2
            exit 1
          }

      - name: Pre-change schema upgrade seam (branch point)
        # Needs full history: the seam cross-checks its rewind against the
        # pre-change ref's migrations, which a shallow clone does not have.
        run: npm run test:schema-upgrade-seam

      - name: Pre-change schema upgrade seam (origin/main)
        # The second meaningful baseline. Both are exercised because the rewind
        # is only honest if it reverts what that specific ref lacks — a seam
        # validated against one ref can silently rewind an object the other ref
        # already has.
        run: SCHEMA_UPGRADE_PRE_CHANGE_REF=origin/main npm run test:schema-upgrade-seam

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: |
          npm run build

  detect-runtime-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.filter.outputs.runtime_changed }}
      schema_changed: ${{ steps.filter.outputs.schema_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect runtime-affecting changes
        id: filter
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          runtime_changed="false"
          schema_changed="false"
          live_build_sha=""
          schema_regex_parts=(
            '^(lib/migrations(\..*)?\.ts'
            '|scripts/run-migrations\.ts'
            '|lib/db-schema-readiness\.ts'
            '|app/api/migrate/route\.ts)$'
          )
          schema_regex="$(printf '%s' "${schema_regex_parts[@]}")"

          resolve_live_build_sha() {
            local payload
            if ! payload="$(curl -fsSL https://adsecute.com/api/build-info 2>/dev/null)"; then
              return 1
            fi

            python3 - "${payload}" 2>/dev/null <<'PY' || return 1
          import json
          import re
          import sys

          payload = json.loads(sys.argv[1])
          build_id = str(payload.get("buildId") or "").strip()
          if re.fullmatch(r"[0-9a-fA-F]{40}", build_id):
              print(build_id, end="")
              raise SystemExit(0)
          raise SystemExit(1)
          PY
          }

          if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            runtime_changed="true"
            schema_changed="true"
            echo "No valid before SHA."
            echo "Defaulting to runtime_changed=true schema_changed=true."
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            runtime_changed="true"
            schema_changed="true"
            echo "Before SHA ${BEFORE_SHA} is not available locally."
            echo "Defaulting to runtime_changed=true schema_changed=true."
          else
            changed_files="$(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")"
            printf 'Changed files:\n%s\n' "${changed_files}"

            runtime_regex_parts=(
              '^(\.github/workflows/|app/|components/|hooks/|lib/'
              '|providers/|public/|scripts/|src/|store/'
              '|docs/v3-01-release-authority\.md$'
              '|Dockerfile$|docker-compose\.yml$|package\.json$|package-lock\.json$'
              '|next\.config\.ts$|next-env\.d\.ts$|postcss\.config\.mjs$'
              '|instrumentation\.ts$|instrumentation\.node\.ts$'
              '|tsconfig\.json$|proxy\.ts$|proxy\.test\.ts$'
              '|middleware\.ts$|middleware\.test\.ts$)'
            )
            runtime_regex="$(printf '%s' "${runtime_regex_parts[@]}")"
            if printf '%s\n' "${changed_files}" | grep -Eq "${runtime_regex}"; then
              runtime_changed="true"
              echo "Runtime-affecting change detected."
            fi

            if printf '%s\n' "${changed_files}" | grep -Eq "${schema_regex}"; then
              schema_changed="true"
              echo "Schema-affecting change detected."
            fi
          fi

          if live_build_sha="$(resolve_live_build_sha)"; then
            echo "Live build SHA resolved from public build-info: ${live_build_sha}"
            if git cat-file -e "${live_build_sha}^{commit}" 2>/dev/null; then
              live_changed_files="$(git diff --name-only "${live_build_sha}" "${CURRENT_SHA}")"
              if printf '%s\n' "${live_changed_files}" | grep -Eq "${schema_regex}"; then
                schema_changed="true"
                echo "Schema-affecting change detected between:"
                echo "live build ${live_build_sha}"
                echo "current build ${CURRENT_SHA}"
              fi
            else
              echo "Live build SHA ${live_build_sha} is not available locally."
              echo "Preserving current schema_changed=${schema_changed}."
            fi
          else
            echo "Unable to resolve live build SHA from public build-info."
            echo "Preserving current schema_changed=${schema_changed}."
          fi

          echo "runtime_changed=${runtime_changed}" >> "$GITHUB_OUTPUT"
          echo "schema_changed=${schema_changed}" >> "$GITHUB_OUTPUT"

  publish-web-image:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-runtime-changes.outputs.runtime_changed == 'true'
    needs:
      - typecheck
      - test
      - detect-runtime-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      WEB_IMAGE: ghcr.io/erhanrdn/omniads-web
      BUILD_CACHE_SCOPE: app-image-build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web-runner
          push: true
          provenance: false
          build-args: |
            APP_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.BUILD_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILD_CACHE_SCOPE }}

  publish-worker-image:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-runtime-changes.outputs.runtime_changed == 'true'
    needs:
      - typecheck
      - test
      - detect-runtime-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      WORKER_IMAGE: ghcr.io/erhanrdn/omniads-worker
      BUILD_CACHE_SCOPE: app-image-build-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker-runner
          push: true
          provenance: false
          build-args: |
            APP_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.BUILD_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILD_CACHE_SCOPE }}

  dispatch-deploy:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-runtime-changes.outputs.runtime_changed == 'true' &&
      needs.publish-web-image.result == 'success' &&
      needs.publish-worker-image.result == 'success'
    needs:
      - publish-web-image
      - publish-worker-image
      - detect-runtime-changes
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch deploy workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy-hetzner.yml/dispatches" \
            -d @- <<EOF
          {
            "ref": "main",
            "inputs": {
              "sha": "${DEPLOY_SHA}",
              "require_current_main_head": "true",
              "run_migrations": "${{ needs.detect-runtime-changes.outputs.schema_changed }}"
            }
          }
          EOF

  skip-runtime-deploy:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-runtime-changes.outputs.runtime_changed != 'true'
    needs:
      - typecheck
      - test
      - detect-runtime-changes
    runs-on: ubuntu-latest
    steps:
      - name: Explain deploy skip
        shell: bash
        run: |
          echo "No runtime-affecting files changed."
          echo "Image publish and deploy were intentionally skipped."
