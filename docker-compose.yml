# ── Image repository: a VARIABLE, and that is load-bearing ──────────────────
#
# The repository was transferred from the legacy erhanrdn/OmniAds owner to
# emrahbilaloglu-ui/OmniAds, so new builds publish to
# ghcr.io/emrahbilaloglu-ui/omniads-{web,worker}. That is the default below, and
# an ordinary deploy sets nothing: it gets the new namespace.
#
# Every image built BEFORE the transfer — including whatever SHA production is
# running right now, and the previous known-good SHA a rollback would target —
# exists ONLY under the legacy ghcr.io/erhanrdn namespace. Those tags were never
# republished under the new owner. So a rollback ACROSS the transfer boundary has
# to name the legacy namespace explicitly, or `docker compose pull` fails with
# "manifest unknown" at the exact moment you need it to work.
#
# ── ROLLBACK TO A PRE-TRANSFER SHA (on the app host) ────────────────────────
#
#   cd /var/www/adsecute
#   export WEB_IMAGE_REPO=ghcr.io/erhanrdn/omniads-web        # legacy namespace
#   export WORKER_IMAGE_REPO=ghcr.io/erhanrdn/omniads-worker  # legacy namespace
#   export APP_IMAGE_TAG=<pre-transfer-sha>
#   export APP_BUILD_ID=<pre-transfer-sha>
#   docker compose pull web worker
#   docker compose up -d --force-recreate web worker
#   docker inspect "$(docker compose ps -q web)" --format '{{.Config.Image}}'
#
# WORKER_IMAGE_REPO covers `migrate` as well as `worker` — they are the same
# image. Both variables must be set in the SAME environment as every compose
# command in the sequence; a `pull` from one namespace followed by an `up` from
# the other is precisely the split-brain this is written to prevent. Rolling the
# CODE back does not roll the SCHEMA back: do not re-run `migrate` as part of a
# rollback unless you have decided separately that the older code can drive the
# newer schema.
#
# Post-transfer SHAs need none of this. Leave both variables unset.
#
# There is deliberately NO automatic fallback from the new namespace to the old
# one. A deploy that quietly pulled from wherever a tag happened to exist would
# produce a split-brain nobody noticed; a genuinely missing tag has to fail loudly
# instead. Explicit and configurable, never silent.
services:
  web:
    image: ${WEB_IMAGE_REPO:-ghcr.io/emrahbilaloglu-ui/omniads-web}:${APP_IMAGE_TAG:-dev-build}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_BUILD_ID: ${APP_BUILD_ID:-dev-build}
      CAMPAIGN_CONTEXT_MODE: ${CAMPAIGN_CONTEXT_MODE:-automatic}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          fetch('http://127.0.0.1:3000/api/healthz').then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  worker:
    image: ${WORKER_IMAGE_REPO:-ghcr.io/emrahbilaloglu-ui/omniads-worker}:${APP_IMAGE_TAG:-dev-build}
    restart: unless-stopped
    # Time to clean up after itself before SIGKILL.
    #
    # The worker's shutdown releases the runner lease and the partitions it
    # holds. Docker's default grace is 10 seconds, which a mid-flight provider
    # tick cannot finish inside — so the worker was killed before its own
    # cleanup ran and left a partition lease orphaned for the ~6 minutes until
    # it expired. That orphan is what made `deploy-disabled` refuse to retire a
    # worker it had already proven dead. Letting the existing cleanup actually
    # run removes the orphan at its source instead of waiting it out.
    stop_grace_period: 90s
    env_file:
      - .env.production
    environment:
      APP_BUILD_ID: ${APP_BUILD_ID:-dev-build}
      CAMPAIGN_CONTEXT_MODE: ${CAMPAIGN_CONTEXT_MODE:-automatic}
      NODE_ENV: production
      SYNC_WORKER_MODE: "1"
      # Empty by default, so an ordinary deploy is unchanged. The cutover sets
      # it to 1 for deploy-disabled, where the worker must come up ADMITTED TO
      # NOTHING so the release can be inspected, and clears it at enable.
      SYNC_WORKER_STAGING_IDLE: ${SYNC_WORKER_STAGING_IDLE:-}
    depends_on:
      - web
    labels:
      autoheal: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node --import tsx scripts/sync-worker-healthcheck.ts --provider-scope meta --online-window-minutes 5 --min-online-workers 1 &&
          node --import tsx scripts/sync-worker-healthcheck.ts --provider-scope google_ads --online-window-minutes 5 --min-online-workers 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # Same image as `worker`, different command — so it takes the SAME repository
  # variable. If these two ever resolved to different namespaces, migrations
  # would run from a different build than the worker that reads the result.
  migrate:
    image: ${WORKER_IMAGE_REPO:-ghcr.io/emrahbilaloglu-ui/omniads-worker}:${APP_IMAGE_TAG:-dev-build}
    env_file:
      - .env.production
    environment:
      APP_BUILD_ID: ${APP_BUILD_ID:-dev-build}
      NODE_ENV: production
      DEPLOY_MIGRATION_TIMEOUT_MS: "${DEPLOY_MIGRATION_TIMEOUT_MS}"
    command: ["node", "--import", "tsx", "scripts/run-migrations.ts"]
    restart: "no"

  # Restarts any container that Docker reports as "unhealthy". The worker's own
  # restart policy (unless-stopped) only fires when the process EXITS, so a hung
  # worker that never exits is invisible to it — this sidecar closes that gap.
  # The worker healthcheck has retries: 5 at a 30s interval, so Docker only marks
  # it unhealthy after ~150s of failures, which debounces transient blips.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "60"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "15"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
