# Creative v2 hardening workflow: read-only safety gate; behavior unchanged.
# Public Raw verification marker: multiline LF formatting required.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc --noEmit

      - name: Verify release authority preflight
        run: >-
          node --import tsx scripts/verify-release-authority.ts --mode=preflight

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: |
          npm run test

      - name: Creative v2 safety gate
        run: |
          npm run creative:v2:safety

  database-seams:
    runs-on: ubuntu-latest
    # Raised with the DR restore, grant-race and context-access seams: each
    # starts its own PostgreSQL and the DR one migrates two databases.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 — the schema upgrade seam reads the pre-change
          # commit's migrations to validate that its rewind describes a schema
          # production actually had.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          echo "EPHEMERAL_PG_BIN_DIR=$(pg_config --bindir)" >> "$GITHUB_ENV"

      # ONE canonical sequence, shared with `npm run verify:pre-push`.
      #
      # This job used to spell every seam out inline. The local habit was to run
      # "the relevant ones", the two lists drifted, and the drift only showed up
      # as a failed push: a guard that passed locally was never re-run on the
      # final tree, and CI ran a different set in a different order. Both sides
      # now execute scripts/verify-database-seams.sh, so there is nothing left
      # to keep in sync. The script echoes each stage, so the log still reads
      # step by step.
      - name: Database seams (canonical sequence)
        run: bash scripts/verify-database-seams.sh


  publish-web-image:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-runtime-changes.outputs.runtime_changed == 'true'
    needs:
      - typecheck
      - test
      # The real-database seams are the only proof the migration, admission,
      # authority and DR paths behave against PostgreSQL rather than a mock.
      # Publishing an image without them means a green pipeline can ship a
      # release whose schema and cutover proofs never ran.
      - database-seams
      - detect-runtime-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # The GHCR namespace has to be THIS repository's owner, not a name we like.
    #
    # secrets.GITHUB_TOKEN is minted for this repository, and `packages: write`
    # grants it push access only to packages owned by the namespace this
    # repository belongs to. After the transfer that owner is emrahbilaloglu-ui,
    # so ghcr.io/erhanrdn is simply not writable from here any more: leaving the
    # old value would fail the push with a 403 denied. It would not quietly
    # publish to the wrong place, but it would break every release.
    #
    # The first push to the new path CREATES the package under emrahbilaloglu-ui
    # and GitHub links this repository to it automatically, so nothing has to be
    # provisioned by hand before the first green main build. Note the reverse is
    # also true and is why the old namespace survives elsewhere: transferring a
    # repository does NOT carry its GHCR packages across, so every pre-transfer
    # image still exists only under ghcr.io/erhanrdn. That namespace is
    # preserved in the rollback path (deploy-hetzner.yml), not here.
    #
    # Written as a literal rather than ghcr.io/${{ github.repository_owner }}:
    # the cross-language contract test compares this exact string against
    # RELEASE_AUTHORITY_WEB_IMAGE in lib/release-authority/types.ts, and an
    # expression cannot be compared statically.
    env:
      WEB_IMAGE: ghcr.io/emrahbilaloglu-ui/omniads-web
      BUILD_CACHE_SCOPE: app-image-build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web-runner
          push: true
          provenance: false
          build-args: |
            APP_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.BUILD_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILD_CACHE_SCOPE }}

  publish-worker-image:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-runtime-changes.outputs.runtime_changed == 'true'
    needs:
      - typecheck
      - test
      # The real-database seams are the only proof the migration, admission,
      # authority and DR paths behave against PostgreSQL rather than a mock.
      # Publishing an image without them means a green pipeline can ship a
      # release whose schema and cutover proofs never ran.
      - database-seams
      - detect-runtime-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Same namespace-and-token reasoning as publish-web-image above. Kept as a
    # per-job literal, rather than composed from one shared workflow-level
    # namespace, because the `env` context is not among the contexts available
    # inside `jobs.<job_id>.env` — referencing it there is a workflow
    # validation error, not a value. Each job still names its image exactly
    # once and every use below goes through ${{ env.WORKER_IMAGE }}.
    env:
      WORKER_IMAGE: ghcr.io/emrahbilaloglu-ui/omniads-worker
      BUILD_CACHE_SCOPE: app-image-build-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker-runner
          push: true
          provenance: false
          build-args: |
            APP_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.BUILD_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILD_CACHE_SCOPE }}

  # THE PRODUCTION RELEASE BOUNDARY.
  #
  # A `dispatch-deploy` job used to live here. It fired automatically on every
  # push to main whose changes touched runtime code, calling the deploy
  # workflow's dispatch API as soon as both images published. Merging was
  # therefore the same act as deploying, and nobody chose the second one.
  #
  # That is removed, deliberately and permanently. CI on main proves the code
  # and publishes the exact-SHA web and worker images; it does not put them on a
  # server. Production deployment is a separate, explicit `workflow_dispatch` of
  # deploy-hetzner.yml carrying a verified 40-hex lowercase SHA and an
  # enumerated image namespace (current | legacy).
  #
  # This is a boundary, not a pause: it is not a commit-message marker, a
  # temporary skip, or a repository variable, because every one of those can be
  # flipped silently by someone who does not know why it was set. Restoring an
  # automatic dispatch means deleting this comment and defeating
  # scripts/check-release-owner-references.sh's sibling guard in
  # scripts/deploy-gate-ordering-check.sh, which asserts no workflow in this
  # repository dispatches a deploy without a human.


  skip-runtime-deploy:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-runtime-changes.outputs.runtime_changed != 'true'
    needs:
      - typecheck
      - test
      # The real-database seams are the only proof the migration, admission,
      # authority and DR paths behave against PostgreSQL rather than a mock.
      # Publishing an image without them means a green pipeline can ship a
      # release whose schema and cutover proofs never ran.
      - database-seams
      - detect-runtime-changes
    runs-on: ubuntu-latest
    steps:
      - name: Explain deploy skip
        shell: bash
        run: |
          echo "No runtime-affecting files changed."
          echo "Image publish and deploy were intentionally skipped."
