name: Deploy to Hetzner

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA to deploy or roll back to
        required: true
        type: string
      image_namespace:
        description: >-
          GHCR namespace holding the images for this SHA. Use legacy to roll
          back to a SHA built before the transfer to emrahbilaloglu-ui.
        required: false
        default: current
        # Enumerated, not free text: this decides which registry production
        # pulls from, and a typo must be impossible to dispatch rather than
        # merely rejected later. The bash step below re-validates it anyway,
        # because a dispatch can also arrive over the API.
        type: choice
        options:
          - current
          - legacy
      require_current_main_head:
        description: Skip this deploy if the SHA is not the current main HEAD
        required: false
        default: "false"
        type: string
      run_migrations:
        description: Run deploy-time database migrations
        required: false
        default: "true"
        type: string
      break_glass:
        description: Allow manual break-glass deploy without enforcing the synthetic deploy gate
        required: false
        default: "false"
        type: string
      override_reason:
        description: Required reason when break_glass is true
        required: false
        default: ""
        type: string
      deploy_migration_timeout_ms:
        description: Optional Node migration timeout override in milliseconds
        required: false
        default: ""
        type: string
      deploy_migration_timeout_seconds:
        description: Optional host migration wrapper timeout override in seconds
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-production-main
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      # The current-namespace images are PRIVATE and the host has no docker
      # login. This grants the job's own short-lived GITHUB_TOKEN read access to
      # the packages this repository publishes — nothing more, and it expires
      # with the job. No PAT is created or stored, and the packages stay private.
      packages: read
    steps:
      - name: Resolve deploy SHA
        id: deploy_sha
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          target_sha="${INPUT_SHA}"

          if [ -z "${target_sha}" ]; then
            echo "Deploy SHA is required."
            exit 1
          fi

          # Lowercase only. Docker tags are case-sensitive and GHCR paths are
          # lowercase, so an uppercase SHA passes a naive hex check and then
          # either silently no-ops against main HEAD or fails at the pull.
          # Refusing is better than normalising: if the caller sent something
          # unexpected, we want to know rather than guess what they meant.
          case "${target_sha}" in
            *[!0-9a-f]*)
              echo "Deploy SHA must be lowercase hexadecimal."
              exit 1
              ;;
          esac

          if [ "${#target_sha}" -ne 40 ]; then
            echo "Deploy SHA must be the full 40-character commit SHA."
            exit 1
          fi

          echo "sha=${target_sha}" >> "$GITHUB_OUTPUT"

      # ── Which namespace can actually serve this SHA ────────────────────────
      #
      # Images built before the repository moved to emrahbilaloglu-ui exist ONLY
      # under ghcr.io/erhanrdn. A repository transfer does not carry GHCR
      # packages with it and they were never republished, so the age of the SHA
      # — not the current default — decides which namespace holds it. Without a
      # way to say so, a rollback across the transfer boundary resolves against
      # the new namespace and dies on "manifest unknown", mid-incident, which is
      # exactly when that is least affordable.
      #
      # Enumerated rather than a free-form registry string on purpose: this
      # resolves to one of two known-good literals, so dispatching a deploy can
      # never aim production at an arbitrary registry.
      #
      # `current` leaves both values EMPTY so the compose file's own default
      # applies and an ordinary deploy behaves exactly as it does today.
      #
      # This step is the CI-side producer of a variable pair consumed further
      # down the chain, in files owned elsewhere:
      #   docker-compose.yml            resolves
      #     ${WEB_IMAGE_REPO:-ghcr.io/emrahbilaloglu-ui/omniads-web} (same for
      #     the worker, which also covers migrate) — already wired.
      #   .github/scripts/hetzner-remote.sh   re-exports both with the same
      #     post-transfer defaults and builds expected_web_image from them, so
      #     pull, start and readback share one identity — already wired.
      #   .github/scripts/hetzner-ssh.sh      run_remote_phase_on_host forwards
      #     both over SSH alongside APP_IMAGE_TAG, so image_namespace=legacy is
      #     live. (This comment previously said the opposite; it was written
      #     before the forwarding landed and was left behind. A stale comment
      #     about SSH forwarding is exactly what this repository has already
      #     been burned by once, so it is corrected rather than deleted.)
      - name: Resolve runtime image namespace
        id: image_namespace
        shell: bash
        env:
          IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
        run: |
          set -euo pipefail

          selected="${IMAGE_NAMESPACE:-current}"

          case "${selected}" in
            current)
              web_image_repo=""
              worker_image_repo=""
              ;;
            legacy)
              web_image_repo="ghcr.io/erhanrdn/omniads-web"
              worker_image_repo="ghcr.io/erhanrdn/omniads-worker"
              ;;
            *)
              echo "image_namespace must be 'current' or 'legacy'; got '${selected}'."
              exit 1
              ;;
          esac

          {
            echo "WEB_IMAGE_REPO=${web_image_repo}"
            echo "WORKER_IMAGE_REPO=${worker_image_repo}"
          } >> "$GITHUB_ENV"

          echo "selected=${selected}" >> "$GITHUB_OUTPUT"

          echo "image_namespace=${selected}"
          echo "web_image_repo=${web_image_repo:-<compose default>}"
          echo "worker_image_repo=${worker_image_repo:-<compose default>}"

      - name: Skip superseded deploys
        id: freshness
        if: inputs.require_current_main_head == 'true'
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.deploy_sha.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_main_sha="$(
            git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" refs/heads/main \
              | awk '{print $1}'
          )"

          if [ -z "${current_main_sha}" ]; then
            echo "Unable to resolve current main HEAD."
            exit 1
          fi

          echo "current_main_sha=${current_main_sha}" >> "$GITHUB_OUTPUT"

          if [ "${DEPLOY_SHA}" != "${current_main_sha}" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded deploy for ${DEPLOY_SHA}; current main is ${current_main_sha}."
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Checkout deploy ref
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deploy_sha.outputs.sha }}
          fetch-depth: 1

      # ── The cutover gate, on its own, before ANY host contact ──────────────
      #
      # This used to live inside "Run database migrations", whose condition ends
      # in `inputs.run_migrations == 'true'`. run_migrations is wired to
      # schema_changed, so every release WITHOUT a schema change skipped the step
      # — and skipped the gate with it — then went straight on to recreate the
      # containers. That is not a theoretical hole: two ops-only releases reached
      # production unattended that way, on commits that never went through a
      # cutover.
      #
      # So it is a step of its own, it depends on NOTHING but the checkout, and
      # it sits ahead of the first thing that touches the host (Prepare SSH
      # access → Sync deploy compose → pull → stop → recreate → migrate). It
      # cannot be skipped by a schema-unchanged release, and every later step is
      # `success() &&`-guarded, so a failure here stops all of them.
      - name: Cutover gate (independent, always runs)
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        shell: bash
        run: |
          set -euo pipefail
          if [ -f deploy/CUTOVER_REQUIRED ]; then
            echo "ABORT deploy/CUTOVER_REQUIRED is present for ${{ steps.deploy_sha.outputs.sha }}."
            echo "This release must go through the cutover wrapper, not the ordinary deploy."
            echo "--- deploy/CUTOVER_REQUIRED ---"
            cat deploy/CUTOVER_REQUIRED || true
            exit 1
          fi
          echo "cutover_gate=clear sha=${{ steps.deploy_sha.outputs.sha }}"

      # Proof BEFORE host mutation.
      #
      # If the token cannot read these exact manifests, the deploy must fail
      # here — on the runner, having touched nothing — rather than half way
      # through a phase on the host. This is also a genuine rehearsal: it uses
      # the same ephemeral-DOCKER_CONFIG, password-on-stdin mechanism the host
      # will use, so a broken mechanism fails here too.
      - name: Verify registry access for the target images (runner-side, no host contact)
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.deploy_sha.outputs.sha }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          set -euo pipefail

          cfg="$(mktemp -d)"
          trap 'docker --config "${cfg}" logout ghcr.io >/dev/null 2>&1 || true; rm -rf "${cfg}"' EXIT

          web="${WEB_IMAGE_REPO:-ghcr.io/emrahbilaloglu-ui/omniads-web}"
          worker="${WORKER_IMAGE_REPO:-ghcr.io/emrahbilaloglu-ui/omniads-worker}"

          # --password-stdin: never in argv, never in the log.
          printf '%s' "${GHCR_PULL_TOKEN}" \
            | docker --config "${cfg}" login ghcr.io -u "${GHCR_PULL_USER}" --password-stdin >/dev/null
          echo "registry login ok (ephemeral config)"

          for ref in "${web}:${DEPLOY_SHA}" "${worker}:${DEPLOY_SHA}"; do
            if docker --config "${cfg}" manifest inspect "${ref}" >/dev/null 2>&1; then
              echo "readable: ${ref}"
            else
              echo "NOT readable: ${ref}" >&2
              echo "The deploy token cannot read this manifest. Nothing on the host has been touched." >&2
              exit 1
            fi
          done

      - name: Prepare SSH access
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        shell: bash
        env:
          BREAK_GLASS: ${{ inputs.break_glass }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ "${BREAK_GLASS}" = "true" ] && [ -z "${OVERRIDE_REASON}" ]; then
            echo "override_reason is required when break_glass=true"
            exit 1
          fi

          if [ -z "${HETZNER_USER}" ] || [ -z "${HETZNER_SSH_KEY}" ] || [ -z "${HETZNER_KNOWN_HOSTS}" ]; then
            echo "Missing required Hetzner deploy secrets."
            exit 1
          fi

          source .github/scripts/hetzner-ssh.sh

          primary_deploy_host="${HETZNER_HOST}"
          public_deploy_host="$(resolve_host "adsecute.com")"
          primary_deploy_host_ip="$(resolve_host "${primary_deploy_host}")"
          public_deploy_host_ip="$(resolve_host "${public_deploy_host}")"

          if [ -z "${primary_deploy_host}" ]; then
            primary_deploy_host="${public_deploy_host}"
            primary_deploy_host_ip="${public_deploy_host_ip}"
          fi

          if [ -z "${primary_deploy_host}" ]; then
            echo "No deploy target host resolved."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${HETZNER_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${HETZNER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          ssh-keyscan -H "${primary_deploy_host}" 2>/dev/null >> ~/.ssh/known_hosts || true
          if [ -n "${public_deploy_host}" ]; then
            ssh-keyscan -H "${public_deploy_host}" 2>/dev/null >> ~/.ssh/known_hosts || true
          fi
          if [ -n "${public_deploy_host_ip}" ]; then
            ssh-keyscan -H "${public_deploy_host_ip}" 2>/dev/null >> ~/.ssh/known_hosts || true
          fi
          chmod 644 ~/.ssh/known_hosts

          {
            echo "PRIMARY_DEPLOY_HOST=${primary_deploy_host}"
            echo "PRIMARY_DEPLOY_HOST_IP=${primary_deploy_host_ip}"
            echo "PUBLIC_DEPLOY_HOST=${public_deploy_host}"
            echo "PUBLIC_DEPLOY_HOST_IP=${public_deploy_host_ip}"
            echo "REMOTE_APP_DIR=/var/www/adsecute"
          } >> "$GITHUB_ENV"

          echo "primary_deploy_host=${primary_deploy_host} primary_deploy_host_ip=${primary_deploy_host_ip}"
          echo "public_deploy_host=${public_deploy_host} public_deploy_host_ip=${public_deploy_host_ip}"

      - name: Sync deploy compose
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        shell: bash
        env:
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
        run: |
          set -euo pipefail
          source .github/scripts/hetzner-ssh.sh
          run_for_each_deploy_host sync_compose_to_host

      - name: Prepare runtime images
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.deploy_sha.outputs.sha }}
          BREAK_GLASS: ${{ inputs.break_glass }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/hetzner-ssh.sh
          run_for_each_deploy_host run_remote_phase_on_host prepare_runtime

      - name: Run database migrations
        if: >-
          success() &&
          (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true') &&
          inputs.run_migrations == 'true'
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.deploy_sha.outputs.sha }}
          BREAK_GLASS: ${{ inputs.break_glass }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          DEPLOY_MIGRATION_TIMEOUT_MS: ${{ inputs.deploy_migration_timeout_ms || vars.DEPLOY_MIGRATION_TIMEOUT_MS }}
          DEPLOY_MIGRATION_TIMEOUT_SECONDS: ${{ inputs.deploy_migration_timeout_seconds || vars.DEPLOY_MIGRATION_TIMEOUT_SECONDS }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/hetzner-ssh.sh
          run_for_each_deploy_host run_remote_phase_on_host run_migrations

      - name: Recreate web and worker
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.deploy_sha.outputs.sha }}
          BREAK_GLASS: ${{ inputs.break_glass }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/hetzner-ssh.sh
          run_for_each_deploy_host run_remote_phase_on_host recreate_services

      - name: Verify local runtime readiness
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.deploy_sha.outputs.sha }}
          BREAK_GLASS: ${{ inputs.break_glass }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/hetzner-ssh.sh
          run_for_each_deploy_host run_remote_phase_on_host verify_runtime

      - name: Persist current-build sync control plane
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.deploy_sha.outputs.sha }}
          BREAK_GLASS: ${{ inputs.break_glass }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          source .github/scripts/hetzner-ssh.sh
          run_for_each_deploy_host run_remote_phase_on_host persist_control_plane

      - name: Verify public build propagation
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        env:
          DEPLOY_SHA: ${{ steps.deploy_sha.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          urls=(
            "https://adsecute.com/api/build-info"
            "https://www.adsecute.com/api/build-info"
          )
          attempts=24
          sleep_seconds=5
          attempt=1

          while [ "${attempt}" -le "${attempts}" ]; do
            pending=0

            for url in "${urls[@]}"; do
              if build_info_json="$(curl -fsSL "${url}" 2>/dev/null)"; then
                build_id="$(
                  printf '%s' "${build_info_json}" | python3 -c 'import json, sys; print((json.load(sys.stdin).get("buildId") or ""), end="")'
                )"
                echo "url=${url} build_id=${build_id:-unknown} attempt=${attempt}/${attempts}"
                if [ -z "${build_id}" ] || [ "${build_id}" != "${DEPLOY_SHA}" ]; then
                  pending=1
                fi
              else
                echo "url=${url} build_info_fetch_failed attempt=${attempt}/${attempts}"
                pending=1
              fi
            done

            if [ "${pending}" -eq 0 ]; then
              exit 0
            fi

            if [ "${attempt}" -lt "${attempts}" ]; then
              sleep "${sleep_seconds}"
            fi
            attempt=$((attempt + 1))
          done

          echo "Public build info did not converge to ${DEPLOY_SHA} across all ingress URLs."
          exit 1

      - name: Smoke test public ingress
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSI https://adsecute.com/about >/dev/null
          curl -fsSI https://www.adsecute.com/about >/dev/null

      - name: Dispatch post-deploy verification workflow
        if: success() && (inputs.require_current_main_head != 'true' || steps.freshness.outputs.should_deploy == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ steps.deploy_sha.outputs.sha }}
        run: |
          set -euo pipefail

          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/post-deploy-verify.yml/dispatches" \
            -d @- <<EOF
          {
            "ref": "main",
            "inputs": {
              "sha": "${DEPLOY_SHA}"
            }
          }
          EOF
